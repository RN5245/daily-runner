name: daily-runner

on:
  # 每天 3 次，北京时间 09:17 / 16:43 / 22:05（相隔 5.5~6.5h，不扎堆）
  # 每次再随机延后 0~10 分钟，避开整点洪峰
  schedule:
    - cron: "17 1 * * *"
    - cron: "43 8 * * *"
    - cron: "5 14 * * *"
  # 手动触发（网页 Actions 页 / CLI: gh workflow run daily-runner）
  workflow_dispatch:
    inputs:
      url:
        description: "要访问的 URL（覆盖同名 Secret）"
        required: false
      jitter:
        description: "随机延后上限（分钟），默认 10"
        required: false
        default: "10"

concurrency:
  group: daily-runner
  cancel-in-progress: false

permissions:
  contents: write   # 允许把 last_run.md 提交回仓库

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 配置 git 身份
        run: |
          git config user.email "actions@users.noreply.github.com"
          git config user.name  "daily-runner[bot]"

      - name: 随机延后（0 ~ jitter 分钟）
        run: |
          JITTER="${{ github.event.inputs.jitter || '10' }}"
          DELAY=$(( RANDOM % (JITTER * 60 + 1) ))
          echo "随机延后 ${DELAY}s (jitter=${JITTER}m) ..."
          sleep "$DELAY"

      - name: 执行任务（过 JS 挑战访问指定网站）
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: |
          URL="${{ github.event.inputs.url || env.TARGET_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::未设置 TARGET_URL（仓库 Secrets）也没有手动传 url"
            exit 1
          fi
          echo "目标: $URL"
          python3 .github/solve.py "$URL" || true   # 失败也继续，保证下面回写

      - name: 回写 last_run.md 到仓库
        run: |
          if [ -f last_run.md ]; then
            git add last_run.md
            if git diff --cached --quiet; then
              echo "无变化，跳过提交"
            else
              git commit -m "chore: 更新 last_run.md [skip ci]"
              for i in 1 2 3 4 5 6; do
                git push origin HEAD && { echo PUSH_OK; break; }
                sleep 3
              done
            fi
          else
            echo "last_run.md 未生成"
          fi
