name: daily-1643

on:
  schedule:
    - cron: "43 8 * * *"   # 北京时间 16:43
  workflow_dispatch:
    inputs:
      jitter:
        description: "随机延后上限（分钟），默认 10"
        required: false
        default: "10"

concurrency:
  group: daily-1643
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.email "actions@users.noreply.github.com"
          git config user.name  "daily-runner[bot]"
      - name: 随机延后
        run: |
          JITTER="${{ github.event.inputs.jitter || '10' }}"
          DELAY=$(( RANDOM % (JITTER * 60 + 1) ))
          echo "随机延后 ${DELAY}s"; sleep "$DELAY"
      - name: 访问站点
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: |
          URL="${{ env.TARGET_URL }}"
          [ -z "$URL" ] && { echo "::error::未设置 TARGET_URL"; exit 1; }
          python3 .github/solve.py "$URL" || true
      - name: 回写 last_run.md
        run: |
          if [ -f last_run.md ]; then
            git add last_run.md
            git diff --cached --quiet || { git commit -m "chore: 更新 last_run.md [skip ci]"; for i in 1 2 3 4 5 6; do git push origin HEAD && break; sleep 3; done; }
          fi
